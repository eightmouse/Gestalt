name: Publish Gestalt Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.ref == 'refs/heads/main' && vars.GESTALT_PAGES_ENABLED == 'true' &&
      (github.event_name != 'schedule' || vars.STEAM_REFRESH_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    outputs:
      deploy: ${{ steps.prepare.outputs.deploy }}
    steps:
      - name: Check out current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          ref: main
          persist-credentials: false
      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0, Node 24
      - name: Check dependency-free runtime syntax
        run: |
          node --check static-app.js
          node --check sw.js
          node --check public/data/records.js
          node --check public/note-inline.js
          node --check public/image-framing.js
          node --check public/x-terminal.js
          node --check public/x-embed.js
          node scripts/test-x-terminal.mjs
          node --check public/steam-display.mjs
          node --check scripts/prepare-pages.mjs
          node scripts/validate-content.mjs
          node scripts/test-steam-snapshot.mjs
          node scripts/test-pages-preparation.mjs
      - name: Prepare public site and optional Steam snapshot
        id: prepare
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
          STEAM_REFRESH_ENABLED: ${{ vars.STEAM_REFRESH_ENABLED }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID: ${{ secrets.STEAM_ID }}
        run: node scripts/prepare-pages.mjs
      - name: Upload only the public artifact
        if: steps.prepare.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0, nested upload uses Node 24
        with:
          path: .pages-site
          retention-days: 1

  deploy:
    needs: prepare
    if: needs.prepare.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy public site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1, Node 24
